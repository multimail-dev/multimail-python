[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimail"
version = "0.1.1"
description = "Python SDK for the MultiMail API — email infrastructure for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "David Hanke", email = "david@multimail.dev" }]
keywords = ["email", "ai", "agents", "mcp", "multimail", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.24.0"]

[project.optional-dependencies]
async = ["httpx[http2]>=0.24.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "respx>=0.20"]

[project.urls]
Homepage = "https://multimail.dev"
Documentation = "https://multimail.dev/docs"
Repository = "https://github.com/multimail-dev/multimail-python"

[tool.pytest.ini_options]
asyncio_mode = "auto"
